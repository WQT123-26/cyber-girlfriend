name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all modules
        run: python -m compileall -q app

      - name: Import app and verify routes
        run: |
          python - <<'PY'
          from app.main import app

          routes = [r for r in app.routes if getattr(r, "path", "").startswith("/api")]
          print(f"total routes = {len(app.routes)}, api routes = {len(routes)}")
          for route in routes:
              methods = ",".join(sorted(getattr(route, "methods", []) or []))
              print(f"  {methods:12s} {route.path}")

          # 冒烟断言：应用可导入、路由已正确聚合（不依赖数据库与网络）
          assert len(app.routes) > 20, f"路由数量异常：{len(app.routes)}"
          assert len(routes) >= 20, f"/api 路由数量异常：{len(routes)}"
          print("smoke ok")
          PY

      - name: Check frontend script syntax
        run: |
          node --check static/app.js
          echo "frontend syntax ok"

  docker:
    name: Dockerfile build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cyber-girlfriend:ci .
